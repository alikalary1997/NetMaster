{% extends 'quiz/base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.12);overflow:hidden;box-sizing:border-box">
        <div style="padding:32px 32px 24px;text-align:center">
            <div style="width:52px;height:52px;border-radius:50%;background:#eef2ff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                <svg style="width:24px;height:24px;color:#4f46e5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            </div>
            <h2 style="font-size:20px;font-weight:700;color:#0f172a;margin:0">Forgot Password?</h2>
            <p style="font-size:13px;color:#64748b;margin:6px 0 0">Enter your email and we'll send you reset instructions</p>
        </div>

        <div style="padding:0 32px 32px">
            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:16px">
                    <label style="display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px">Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com" style="width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;box-sizing:border-box">
                </div>
                <button type="submit" style="width:100%;height:46px;background:#4f46e5;color:#fff;font-size:14px;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:background .15s">Send Reset Link</button>
            </form>
            <p style="text-align:center;font-size:13px;color:#64748b;margin:20px 0 0">
                Remember your password? <a href="{% url 'login' %}" style="color:#4f46e5;font-weight:600;text-decoration:none">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
