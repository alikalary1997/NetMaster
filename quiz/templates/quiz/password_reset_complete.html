{% extends 'quiz/base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.12);overflow:hidden;text-align:center;box-sizing:border-box">
        <div style="padding:40px 32px">
            <div style="width:52px;height:52px;border-radius:50%;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                <svg style="width:24px;height:24px;color:#059669" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <h2 style="font-size:20px;font-weight:700;color:#0f172a;margin:0">Password Changed</h2>
            <p style="font-size:13px;color:#64748b;margin:8px 0 0;line-height:1.6">Your password has been successfully reset. You can now login with your new password.</p>
            <a href="{% url 'login' %}" style="display:inline-block;margin-top:24px;padding:11px 24px;background:#4f46e5;color:#fff;font-size:14px;font-weight:600;border-radius:10px;text-decoration:none">Login</a>
        </div>
    </div>
</div>
{% endblock %}
