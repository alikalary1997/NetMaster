{% extends 'quiz/base.html' %}

{% block title %}Email Sent{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.12);overflow:hidden;text-align:center;box-sizing:border-box">
        <div style="padding:40px 32px">
            <div style="width:52px;height:52px;border-radius:50%;background:#ecfdf5;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                <svg style="width:24px;height:24px;color:#059669" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <h2 style="font-size:20px;font-weight:700;color:#0f172a;margin:0">Check Your Email</h2>
            <p style="font-size:13px;color:#64748b;margin:8px 0 0;line-height:1.6">We've sent password reset instructions to your email address. Please check your inbox and spam folder.</p>
            <a href="{% url 'login' %}" style="display:inline-block;margin-top:24px;padding:11px 24px;background:#4f46e5;color:#fff;font-size:14px;font-weight:600;border-radius:10px;text-decoration:none">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
