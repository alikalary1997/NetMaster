{% extends 'quiz/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-base-100 p-8 rounded-xl shadow-md">
    <h2 class="text-2xl font-bold mb-2">Change Password</h2>
    <p class="text-sm text-base-content/60 mb-6">Set a new password for <strong>{{ target_user.username }}</strong></p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} shadow-lg mb-4">
                <span>{{ message }}</span>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-control mb-4">
            <label class="label"><span class="label-text">New Password</span></label>
            <input type="password" name="new_password" class="input input-bordered" required minlength="6" placeholder="Min 6 characters">
        </div>
        <div class="form-control mb-6">
            <label class="label"><span class="label-text">Confirm Password</span></label>
            <input type="password" name="confirm_password" class="input input-bordered" required minlength="6" placeholder="Re-enter password">
        </div>
        <div class="flex gap-2">
            <button type="submit" class="btn btn-primary flex-1">Change Password</button>
            <a href="{% url 'custom_admin_users' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
